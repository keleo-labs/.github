# Shared secret scan for every keleo-labs repository.
#
# Server-side backstop for the local pre-commit hooks. Repositories call this
# rather than carrying their own copy, because the three that grew one
# independently ended up with three different sets of workarounds for the same
# scanner quirks. Fixing one of those is now a single commit here.
#
# Caller contract -- .github/workflows/secret-scan.yml in each repository:
#
#   name: secret scan
#   on:
#     push:
#     pull_request:
#     workflow_dispatch:
#     schedule:
#       - cron: "17 4 * * 1"
#   jobs:
#     scan:
#       uses: keleo-labs/.github/.github/workflows/secret-scan-reusable.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#       secrets: inherit
#
# The caller must also have a .gitleaks.toml; GITLEAKS_CONFIG below points at
# it and gitleaks fails rather than silently falling back to defaults.
#
# GITLEAKS_LICENSE is an organisation secret on keleo-labs. gitleaks-action
# refuses to run on an organisation-owned repository without one -- the
# scanner is MIT licensed, only the Action wrapper is not. `secrets: inherit`
# is what passes it through from the caller.

name: secret scan (reusable)

on:
  workflow_call:
    secrets:
      GITLEAKS_LICENSE:
        required: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      # fetch-depth: 0 is required. The default shallow clone gives the
      # scanner one commit to look at, which quietly reduces this to the same
      # scope as the pre-commit hook.
      #
      # checkout@v5 and gitleaks-action@v3, not v4/v2: those run on Node 20,
      # which GitHub has announced it is removing from hosted runners.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Scope note worth knowing: on push and pull_request the action scans
      # only the commit range of that event, NOT full history -- it passes
      # --log-opts derived from base..head. Full history is scanned only on
      # schedule and workflow_dispatch, which is why callers set a weekly cron.
      # The trufflehog job below covers full history on every run.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pinned, and kept in step with the gitleaks rev in each
          # repository's .pre-commit-config.yaml, so a commit that passes the
          # hook cannot fail here on a rule set the hook never had. Left
          # unset, the action pins itself to a much older default.
          GITLEAKS_VERSION: "8.30.1"

  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The published image rather than trufflesecurity/trufflehog@main: that
    # action compares BASE to HEAD, which it cannot do on the first push of a
    # new branch, and it supplies --fail and --no-update itself so passing
    # either through extra_args is a fatal "flag cannot be repeated". Running
    # the image directly avoids both and scans full history every time.
    container:
      image: trufflesecurity/trufflehog:3.99.2
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The checkout is owned by a different uid than the container user, and
      # git refuses to read a repository it considers foreign.
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # --only-verified calls the provider's API to confirm a credential is
      # live, so an expired token in old history does not fail every build.
      - name: trufflehog (verified only, full history)
        run: trufflehog git file://. --only-verified --fail --no-update
